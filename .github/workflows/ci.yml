name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # This repository alone. Two checks in i18n-keys.spec.ts need
      # UniBooks-BE beside this one to answer — which codes the backend emits,
      # and which keys only Python references — and they skip themselves when
      # it is absent. That is deliberate: verifying a contract between two
      # repositories belongs where both exist at the versions that ship
      # together, which is the umbrella repository, not here. See its
      # contract job. A red build here always means this repository.
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
