name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # playwright and puppeteer are devDependencies of the local recording
      # tooling, and each downloads a browser on install — around 1.7GB
      # between them. Nothing in CI drives a real browser: the tests run on
      # vitest with jsdom, and the build needs none. Skipping the downloads
      # removes minutes and a network failure mode from every run. Variable
      # names read off the installed packages, not from memory.
      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # Both scripts run scripts/set-env.js first. With none of the NG_APP_*
      # or shared origins set it uses its defaults and leaves public/_headers
      # untouched, which is the path a contributor's machine takes too.
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
