name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # puppeteer is a devDependency here that nothing references — see the
      # note in package.json — and it downloads a browser on install, around
      # 1.1GB. Nothing in CI drives a real browser: the tests run on vitest
      # with jsdom and the build needs none, so that is minutes and a network
      # failure mode bought for nothing. Variable name read off the installed
      # package, not from memory.
      - name: Install
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # Both scripts run scripts/set-env.js first. With none of the NG_APP_*
      # or shared origins set it uses its defaults and leaves public/_headers
      # untouched, which is the path a contributor's machine takes too.
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
