<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CycleUni - Campus Marketplace</title>
  <meta name="description" content="CycleUni is a second-hand book and item trading platform designed for university students, making campus resource recycling simple.">
  <base href="/">
  <!-- interactive-widget=resizes-content: on Android Chrome the default
       (resizes-visual) keeps the *layout* viewport pinned to the full screen
       resolution when the on-screen keyboard opens — only the visual
       viewport shrinks. Since 100dvh/flex sizing in this app is computed
       against the layout viewport, that default makes the keyboard cover
       the message input instead of the layout reflowing above it, i.e. the
       input's position ends up governed by raw device resolution rather
       than the real visible height. resizes-content makes the layout
       viewport (and therefore 100dvh) shrink with the keyboard, matching
       the "real page height, not device resolution" behavior the bottom
       nav bar's 100dvh already relies on. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1E5C46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CycleUni">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <script>
    // Applies the saved theme choice before first paint so there's no flash
    // of the wrong theme while Angular boots. Mirrors ThemeService's own
    // logic/storage key (src/app/core/services/theme.service.ts) — keep
    // both in sync if that key or the light/dark values ever change.
    (function () {
      try {
        var stored = localStorage.getItem('cycleuni_theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
